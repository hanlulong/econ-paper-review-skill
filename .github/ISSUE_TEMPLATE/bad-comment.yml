name: Report a bad comment
description: A review comment was wrong, unfair, or invented — bad comments are bugs here.
title: "[Bad comment]: "
labels: ["bad-comment"]
body:
  - type: dropdown
    id: what
    attributes:
      label: What went wrong
      options:
        - Invented a quote, number, or fact
        - Misread what the paper says
        - Unfair or out of proportion
        - An editing comment changed the meaning
        - Other
    validations:
      required: true
  - type: textarea
    id: comment
    attributes:
      label: The comment
      description: Paste the comment from the report. Redact anything confidential — enough context to judge is plenty.
    validations:
      required: true
  - type: textarea
    id: reality
    attributes:
      label: What the paper actually says
      description: Quote or describe the manuscript text the comment got wrong, or explain why the comment is unfair or unverifiable.
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Review mode, client and model
      placeholder: "full mode, Claude Code (macOS), model name"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Econ Review version (if known)
      description: "Plugin users: the plugin manager shows it. For a standalone copy, give the date you installed or last updated it."
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Paper type, field, or anything that helps reproduce the failure (redacted as needed).
